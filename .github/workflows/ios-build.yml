name: iOS Build Check

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ios-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run ts:check

      - name: Generate native iOS project
        run: npx expo prebuild --clean --platform ios
        env:
          CI: 1

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/CocoaPods
            ~/.cocoapods
            ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install
        env:
          COCOAPODS_DISABLE_STATS: true

      - name: Build unsigned iOS app
        run: |
          xcodebuild \
            -workspace ios/ConvCalc.xcworkspace \
            -scheme ConvCalc \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          rm -rf Payload Calculator-unsigned.ipa
          mkdir Payload
          cp -R ios/build/Build/Products/Release-iphoneos/ConvCalc.app Payload/ConvCalc.app
          zip -qry Calculator-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-unsigned
          path: Calculator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
